services:
  - type: web
    name: talonario-amigo-api
    env: docker
    plan: free
    region: oregon
    rootDir: TALONARIOAMIGO
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: TalonarioAmigo
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://talonario-amigo-api.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: talonario-amigo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: talonario-amigo-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: talonario-amigo-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: talonario-amigo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: talonario-amigo-db
          property: password
      # APP_KEY se define en el panel de Render (Environment > Secret Files / envVar) — NUNCA en este archivo.
      # Generar con: php artisan key:generate --show
      - key: APP_KEY
        sync: false
      # Configuración de la librería firmadora SRI (la emisión usa el .p12 del emisor logueado;
      # estos valores cubren SOAP/ambiente/envío).
      - key: FACTURACION_AMBIENTE
        value: "1"
      - key: FACTURACION_SOAP_TIMEOUT
        value: "30"
      - key: FACTURACION_CA_FILE
        value: ""
      # Almacenamiento Supabase Storage (bóveda de XML/RIDE)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: talonario-amigo-vault
      # Email (Resend)
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: DEFAULT_SUPPORT_WHATSAPP
        value: "593993050689"

databases:
  - name: talonario-amigo-db
    plan: free
    databaseName: talonario_amigo_prod
    user: talonario_user
