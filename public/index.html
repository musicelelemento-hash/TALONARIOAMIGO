            async executeEmit3DSequenceWithBackend() {
                const btnEmitir = document.getElementById('btn-emitir-sri');
                if (btnEmitir) {
                    btnEmitir.innerText = "⌛ Conectando con SRI Ecuador...";
                    btnEmitir.style.background = "#1D4ED8";
                }

                const clienteNombre = document.getElementById('fact-cliente-nombre')?.value || "Juan Pérez";
                const clienteRuc = document.getElementById('fact-cliente-ruc')?.value || "1712345678";
                const clienteDir = document.getElementById('fact-cliente-dir')?.value || "Quito, Ecuador";
                const totalMonto = document.getElementById('grand-total-display')?.innerText || "$85.00";

                const items = [];
                document.querySelectorAll('#realista-items-body tr').forEach(row => {
                    const qty = row.querySelector('.item-qty')?.value;
                    const desc = row.querySelector('.item-desc')?.value;
                    const price = row.querySelector('.item-price')?.value;
                    if (qty && desc && price) {
                        items.push({ cantidad: qty, descripcion: desc, precioUnitario: price });
                    }
                });

                const payload = {
                    comprobante: "NOTA_DE_VENTA",
                    secuencial: String(this.state.currentDocNumber).padStart(9, '0'),
                    emisorRuc: "0706050986001",
                    cliente: { nombre: clienteNombre, ruc: clienteRuc, direccion: clienteDir },
                    items: items,
                    total: totalMonto,
                    fechaEmision: new Date().toISOString()
                };

                try {
                    await fetch(RENDER_EMISION_ENDPOINT, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch(e) {}

                this.triggerHaptic([40, 30, 80]);
                const stampBadge = document.getElementById('stamp-sri-badge');
                const paperCard = document.getElementById('receipt-paper-card');

                if (stampBadge) stampBadge.classList.add('slam-anim');

                setTimeout(() => {
                    if (paperCard) {
                        paperCard.classList.remove('paper-glide-in');
                        paperCard.classList.add('tearing-away');
                    }
                    this.triggerHaptic(30);

                    setTimeout(() => {
                        this.state.currentDocNumber += 1;
                        this.evaluateStateAndRender();
                    }, 700);
                }, 1100);
            }

            recalculateTotals() {
                const rows = document.querySelectorAll('#realista-items-body tr');
                let grandTotal = 0;

                rows.forEach(row => {
                    const qtyInput = row.querySelector('.item-qty');
                    const priceInput = row.querySelector('.item-price');
                    const totalCell = row.querySelector('.row-total');

                    if (qtyInput && priceInput && totalCell) {
                        const qty = parseFloat(qtyInput.value) || 0;
                        const price = parseFloat(priceInput.value) || 0;
                        const rowTotal = qty * price;
                        totalCell.innerText = `$${rowTotal.toFixed(2)}`;
                        grandTotal += rowTotal;
                    }
                });

                const totalDisplay = document.getElementById('grand-total-display');
                if (totalDisplay) { totalDisplay.innerText = `$${grandTotal.toFixed(2)}`; }
            }

            setRole(role) {
                this.triggerHaptic(15);

                this.evaluateStateAndRender();
            }

            handleLogin() {
                this.triggerHaptic(20);
                const email = document.getElementById('input-login-email')?.value || 'usuario@ejemplo.com';
                
                if (email.includes('admin') || email.includes('owner')) this.state.currentRole = 'SUPER_ADMIN';
                else if (email.includes('imprenta') || email.includes('reseller')) this.state.currentRole = 'RESELLER';
                else this.state.currentRole = 'CLIENT';

                this.state.isLoggedIn = true;
                this.evaluateStateAndRender();

            createReseller() {
                this.triggerHaptic(20);
                const name = document.getElementById('new-reseller-name').value;

                alert(`🏭 Imprenta "${name}" registrada en Supabase (${SUPABASE_URL}) con su lote de ${size} licencias.`);
                this.evaluateStateAndRender();
            }

            createClientByReseller() {
                this.triggerHaptic(20);
                const name = document.getElementById('reseller-client-name').value;
                this.state.resellerQuota.total_used += 1;
                this.state.resellerQuota.available_slots -= 1;
                alert(`👤 Cliente "${name}" dado de alta en Supabase (${SUPABASE_URL}).`);
                this.evaluateStateAndRender();
            }
