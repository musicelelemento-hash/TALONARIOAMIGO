name: CI - Talonario Amigo Quality Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend Lint & Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TALONARIOAMIGO
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: TALONARIOAMIGO/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Vite Frontend
        run: npm run build

  backend:
    name: Backend PHP Syntax & PHPUnit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TALONARIOAMIGO
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite, soap, openssl
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check PHP Syntax
        run: find app routes config database liberias_sri -name "*.php" -exec php -l {} \; > /dev/null

      - name: Run PHPUnit Tests
        run: vendor/bin/phpunit --no-coverage
